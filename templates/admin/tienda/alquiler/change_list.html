{% extends "admin/change_list.html" %}

{% block object-tools-items %}
    <li>
        <form method="get" style="display: flex; gap: 8px; align-items: center; margin-right: 8px;">
            {% for key, value in request.GET.items %}
                {% if key != "fecha_desde" and key != "fecha_hasta" and key != "p" %}
                    <input type="hidden" name="{{ key }}" value="{{ value }}" />
                {% endif %}
            {% endfor %}
            <label for="id_fecha_desde">Desde:</label>
            <input id="id_fecha_desde" type="date" name="fecha_desde" value="{{ fecha_desde }}" />
            <label for="id_fecha_hasta">Hasta:</label>
            <input id="id_fecha_hasta" type="date" name="fecha_hasta" value="{{ fecha_hasta }}" />
            <button type="submit" class="button">Aplicar</button>
            <a class="button" href=".">Limpiar</a>
        </form>
    </li>
    {{ block.super }}
{% endblock %}
